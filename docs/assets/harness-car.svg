<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" role="img" aria-labelledby="t d">
<title id="t">The openloops harness</title>
<desc id="d">A car made of an engine (the AI model), a chassis (the harness) and a body (the loop). The body changes while the engine and the chassis stay the same: a different body, a different agent.</desc>
<style>
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.body,.role{opacity:0;animation:cycle 12.8s infinite both;transform-box:fill-box}
.b0{opacity:1}
@keyframes cycle{0%{opacity:0;transform:translateY(-14px)}1.5%{opacity:1;transform:translateY(0)}23.5%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.spin{animation:spin 1.1s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.motor{animation:motor .8s ease-in-out infinite}
@keyframes motor{0%,100%{opacity:1}50%{opacity:.6}}
.node{animation:node 1.2s ease-in-out infinite}
@keyframes node{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.body,.role,.spin,.motor,.node{animation:none}.node{opacity:1}}
</style>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern></defs>
<rect x="0.5" y="0.5" width="559" height="309" rx="16" fill="#0d1016" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="1" y="1" width="558" height="308" rx="15" fill="url(#grid)"/>
<line x1="30" y1="218" x2="530" y2="218" stroke="#64748b" stroke-width="1" stroke-dasharray="6 8"/>
<g class="body b0" style="animation-delay:0s">
<path d="M 90 150 L 90 128 Q 90 118 104 116 L 190 110 L 225 82 Q 232 76 244 76 L 330 76 Q 342 76 350 84 L 378 110 L 462 118 Q 478 120 478 134 L 478 150 Z" fill="#cbd5e1" fill-opacity="0.04" stroke="#cbd5e1" stroke-width="1.75" stroke-linejoin="round"/>
<path d="M 232 84 L 292 84 L 292 108 L 205 108 Z M 300 84 L 336 84 L 366 108 L 300 108 Z" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round"/>
<line x1="290" y1="62" x2="290" y2="72" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<text class="mono" x="290" y="54" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#cbd5e1">BODY<tspan fill="#94a3b8"> (</tspan><tspan fill="#f8fafc">LOOP</tspan><tspan fill="#94a3b8">)</tspan></text>
</g>
<g class="body b1" style="animation-delay:3.2s">
<path d="M 90 150 L 90 132 Q 90 124 102 122 L 200 116 Q 240 84 290 84 L 330 84 Q 350 86 362 104 L 372 114 L 462 124 Q 480 128 480 138 L 480 150 Z" fill="#cbd5e1" fill-opacity="0.04" stroke="#cbd5e1" stroke-width="1.75" stroke-linejoin="round"/>
<path d="M 232 112 Q 258 92 290 92 L 330 92 Q 342 94 350 110 Z" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round"/>
<line x1="290" y1="62" x2="290" y2="80" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<text class="mono" x="290" y="54" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#cbd5e1">BODY<tspan fill="#94a3b8"> (</tspan><tspan fill="#f8fafc">LOOP</tspan><tspan fill="#94a3b8">)</tspan></text>
</g>
