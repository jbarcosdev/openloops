<text class="mono" x="330" y="54" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#cbd5e1">BODY<tspan fill="#94a3b8"> (</tspan><tspan fill="#f8fafc">LOOP</tspan><tspan fill="#94a3b8">)</tspan></text>
</g>
<g>
<rect class="motor" x="394" y="122" width="66" height="26" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="410" y1="128" x2="410" y2="142" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
<line x1="426" y1="128" x2="426" y2="142" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
<line x1="442" y1="128" x2="442" y2="142" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
<line x1="427" y1="108" x2="427" y2="120" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<text class="mono" x="445" y="100" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#cbd5e1">ENGINE<tspan fill="#94a3b8"> (</tspan><tspan fill="#f8fafc">AI MODEL</tspan><tspan fill="#94a3b8">)</tspan></text>
</g>
<g><rect x="80" y="150" width="400" height="18" rx="9" fill="#C06CF0" fill-opacity="0.2" stroke="#C06CF0" stroke-width="2"/>
<circle class="node" cx="170" cy="159" r="4" fill="#C06CF0" style="animation-delay:0s"/>
<circle class="node" cx="235" cy="159" r="4" fill="#C06CF0" style="animation-delay:0.25s"/>
<circle class="node" cx="300" cy="159" r="4" fill="#C06CF0" style="animation-delay:0.5s"/>
<circle class="node" cx="365" cy="159" r="4" fill="#C06CF0" style="animation-delay:0.75s"/>
<g transform="translate(150 190)"><circle r="28" fill="#0B0E14" stroke="#cbd5e1" stroke-width="2.5"/><g class="spin">
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(0)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(72)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(144)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(216)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(288)"/>
</g><circle r="8" fill="#0B0E14" stroke="#cbd5e1" stroke-width="1.5"/></g>
<g transform="translate(410 190)"><circle r="28" fill="#0B0E14" stroke="#cbd5e1" stroke-width="2.5"/><g class="spin">
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(0)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(72)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(144)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(216)"/>
<line x1="0" y1="-8" x2="0" y2="-20" stroke="#64748b" stroke-width="2" transform="rotate(288)"/>
</g><circle r="8" fill="#0B0E14" stroke="#cbd5e1" stroke-width="1.5"/></g>
<line x1="280" y1="172" x2="280" y2="232" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<text class="mono" x="280" y="248" text-anchor="middle" font-size="11" letter-spacing="1.2" font-weight="700" fill="#C06CF0">CHASSIS<tspan fill="#94a3b8"> (</tspan><tspan fill="#e9d5ff">HARNESS</tspan><tspan fill="#94a3b8">)</tspan></text></g>
<text class="mono role b0" x="280" y="278" text-anchor="middle" font-size="13" fill="#f8fafc" style="animation-delay:0s">Personal assistant</text>
<text class="mono role b1" x="280" y="278" text-anchor="middle" font-size="13" fill="#f8fafc" style="animation-delay:3.2s">Analyst</text>
<text class="mono role b2" x="280" y="278" text-anchor="middle" font-size="13" fill="#f8fafc" style="animation-delay:6.4s">Customer support</text>
<text class="mono role b3" x="280" y="278" text-anchor="middle" font-size="13" fill="#f8fafc" style="animation-delay:9.6s">Programmer</text>
<text class="mono" x="280" y="298" text-anchor="middle" font-size="11" fill="#94a3b8">Same engine. Same chassis. A different body, a different agent.</text>
</svg>