<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM evaluation report</title>
<style>
:root{--bg:#f4f3ef;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#807f79;--line:#e4e2db;--soft:#efede7;--accent:#2a78d6;--good:#1b7f4c;--bad:#c23b3a;--warn:#b7791f;--shadow:0 1px 2px rgba(20,20,10,.05),0 6px 18px rgba(20,20,10,.04);
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2c2c2a;--soft:#232321;--accent:#3987e5;--good:#3ecf84;--bad:#f06a6a;--warn:#e0a84a;--shadow:none;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
:root[data-theme="dark"]{--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2c2c2a;--soft:#232321;--accent:#3987e5;--good:#3ecf84;--bad:#f06a6a;--warn:#e0a84a;--shadow:none;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{padding:26px 0 14px}
.toprow{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:650}
.sub{color:var(--ink2);font-size:13px}
.muted{color:var(--muted)}
.icons{display:flex;gap:8px}
.ibtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 inherit;cursor:pointer;display:grid;place-items:center}
.ibtn:hover{border-color:var(--ink2)}
nav.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;font:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.scope{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 0 4px;color:var(--ink2);font-size:13px}
.scope label{display:flex;gap:6px;align-items:center}
select,input[type=search],input[type=number]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit}
main{padding:10px 0 80px}
section.tab{display:none}section.tab.on{display:block}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 6px}
.lead{font-size:13px;color:var(--ink2);margin:0 0 14px;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:16px}
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-top:0}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.toprow{flex-direction:column}}
.headline{font-size:22px;line-height:1.35;letter-spacing:-.015em;font-weight:600;margin:0 0 6px;max-width:34em}
.headline em{font-style:normal;color:var(--accent)}
.kpi .k{color:var(--ink2);font-size:12.5px}.kpi .v{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin:2px 0}.kpi .n{color:var(--muted);font-size:12.5px}
.rec{display:flex;flex-direction:column;gap:8px}
.rec .tag{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rec .big{font-size:24px;font-weight:650;letter-spacing:-.02em}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:13px}.facts b{color:var(--ink)}
.setup{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.setup .nm{font-weight:600}
.pill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink2);white-space:nowrap}
.pill.mode{cursor:help;color:var(--ink)}
.pill.mode::after{content:"i";display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--muted);font-size:9px;font-style:italic;color:var(--muted)}
.pill[data-tip]{cursor:help}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.insights li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.insights .ic{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--ink2);font-weight:700}
.insights .ic.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.insights .ic.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.insights .ic.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--ink2);font-weight:600;font-size:12px;background:var(--surface);position:sticky;top:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th.sortable{cursor:pointer}th.sorted::after{content:" ▾"}th.sorted.asc::after{content:" ▴"}
.scroll{overflow:auto;max-height:620px}
td.c{text-align:center;font-variant-numeric:tabular-nums;min-width:64px}
.hm td.c{border-radius:0;font-weight:600}
.rows{display:grid;gap:7px}
.hrow{display:grid;grid-template-columns:minmax(170px,44%) 1fr 84px;gap:12px;align-items:center;font-size:13px}
.hrow .lab{line-height:1.3}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex;gap:2px}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.stack .fill{border-radius:3px}
.hrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2);background:var(--surface)}
button.chip{cursor:pointer;font:inherit;font-size:12.5px}button.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard h3{font-size:15px;margin:0}
.mcard dl{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;margin:0;font-size:12.5px}.mcard dt{color:var(--muted)}.mcard dd{margin:0;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.stats .n{font-size:18px;font-weight:650;letter-spacing:-.01em}.stats .l{font-size:11.5px;color:var(--muted)}
.note{border-left:3px solid var(--line);padding:6px 12px;color:var(--ink2);font-size:13px;background:var(--soft);border-radius:0 8px 8px 0;margin-top:14px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
svg text{fill:var(--muted);font-size:11px}svg .axis{stroke:var(--line)}svg .pt{cursor:pointer;stroke:var(--surface);stroke-width:2}
.pin{margin-top:10px;font-size:12.5px;color:var(--ink2);min-height:38px}.pin b{color:var(--ink)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:8px;padding:10px;font-size:12px;margin:8px 0 0}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;display:none;max-width:360px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#tip b{font-size:13px}#tip .th{margin-top:7px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.65}#tip ul{margin:3px 0 0;padding-left:16px}#tip li{margin:1px 0}#tip .nt{margin-top:7px;opacity:.8}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s;border-left:1px solid var(--line);display:flex;flex-direction:column}
body.help #veil{opacity:1;pointer-events:auto}body.help #drawer{transform:none}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
#drawer .body{overflow:auto;padding:6px 22px 40px}
#drawer h3{margin:20px 0 6px}#drawer p{margin:0 0 8px;color:var(--ink2)}
.def{display:grid;gap:12px}.def div b{display:block}.def div span{color:var(--ink2)}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mini b{display:block}.mini ul{margin:4px 0 0;padding-left:18px;color:var(--ink2)}.mini .th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
</style>
</head>

const sum = (list, key) => list.reduce((a, r) => a + (r[key] || 0), 0);
function aggregate (list) {
  const runs = sum(list, 'runs'), correct = sum(list, 'correct'), cost = sum(list, 'cost'), calls = sum(list, 'calls');
  const weighted = key => runs ? list.reduce((a, r) => a + (r[key] || 0) * r.runs, 0) / runs : undefined;
  const cached = list.filter(r => r.hasCache);
  const inputAll = sum(cached, 'inputAll');
  return { runs, correct, cost, accuracy: runs ? correct / runs : 0, costPerCorrect: correct ? cost / correct : undefined, secPerRun: weighted('secPerRun'), msPerCall: calls ? list.reduce((a, r) => a + (r.msPerCall || 0) * r.calls, 0) / calls : undefined, errors: sum(list, 'errors'), setups: list.length, cacheRows: cached.length, hitRate: inputAll ? sum(cached, 'cacheRead') / inputAll : undefined, saved: cached.length ? sum(cached, 'saved') : undefined, costNoCache: cached.length ? sum(cached, 'costNoCache') : undefined, cachedCost: sum(cached, 'cost') };
}
const group = (list, fn) => { const m = new Map(); for (const r of list) { const k = fn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; };

function scatter (id, list, xKey, xLabel, xFmt, log) {
  const W = 600, H = 380, m = { l: 48, r: 16, t: 14, b: 44 };
  const pts = list.filter(r => r[xKey] != null && isFinite(r[xKey]) && (!log || r[xKey] > 0));
  if (!pts.length) { $(id).innerHTML = '<div class="empty">No data</div>'; return; }
  const xs = pts.map(r => log ? Math.log10(r[xKey]) : r[xKey]);
  let lo = Math.min(...xs), hi = Math.max(...xs);
  if (lo === hi) { lo -= .5; hi += .5; }
  const pad = (hi - lo) * .07; lo -= pad; hi += pad;
  const X = v => m.l + ((log ? Math.log10(v) : v) - lo) / (hi - lo) * (W - m.l - m.r);
  const yMin = Math.max(0, Math.floor((Math.min(...pts.map(r => r.accuracy)) - .05) * 10) / 10);
  const Y = v => m.t + (1 - (v - yMin) / (1 - yMin)) * (H - m.t - m.b);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(xLabel) + ' against accuracy">';
  for (let i = 0; i <= 4; i++) { const v = yMin + (1 - yMin) * i / 4; svg += '<line class="axis" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (m.l - 7) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + pct(v) + '</text>'; }
  for (let i = 0; i <= 4; i++) { const t = lo + (hi - lo) * i / 4; svg += '<text x="' + (m.l + (W - m.l - m.r) * i / 4) + '" y="' + (H - 22) + '" text-anchor="middle">' + xFmt(log ? Math.pow(10, t) : t) + '</text>'; }
  svg += '<text x="' + (W / 2 + 20) + '" y="' + (H - 4) + '" text-anchor="middle">' + xLabel + '</text><text transform="translate(12,' + (H / 2) + ') rotate(-90)" text-anchor="middle">Accuracy</text>';
  const shape = (k, cx, cy, extra, size = 6.5) => {
    const r = size;
    if (k === 1) return '<rect ' + extra + ' x="' + (cx - r) + '" y="' + (cy - r) + '" width="' + 2 * r + '" height="' + 2 * r + '" rx="2"/>';
    if (k === 2) return '<path ' + extra + ' d="M' + cx + ',' + (cy - r - 1) + ' L' + (cx + r + 1) + ',' + (cy + r) + ' L' + (cx - r - 1) + ',' + (cy + r) + ' Z"/>';
    if (k === 3) return '<path ' + extra + ' d="M' + cx + ',' + (cy - r - 2) + ' L' + (cx + r + 2) + ',' + cy + ' L' + cx + ',' + (cy + r + 2) + ' L' + (cx - r - 2) + ',' + cy + ' Z"/>';
    return '<circle ' + extra + ' cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
  };
  pts.forEach((r, i) => { svg += shape(Math.max(0, MODE_ORDER.indexOf(r.mode)), X(r[xKey]), Y(r.accuracy), 'class="pt" data-i="' + i + '" style="fill:' + colorOf(r.model) + '"'); });
  const front = pts.filter(p => !pts.some(q => q !== p && q[xKey] <= p[xKey] && q.accuracy >= p.accuracy && (q[xKey] < p[xKey] || q.accuracy > p.accuracy))).sort((a, b) => b.accuracy - a.accuracy || a[xKey] - b[xKey]).slice(0, 6);
  const placed = [];
  for (const p of front) {
    const text = p.snapshot + ' · ' + (MODES[p.mode] || { short: p.mode }).short + (p.reasoning === 'n/a' ? '' : ' · ' + p.reasoning);
    const px = X(p[xKey]), py = Y(p.accuracy), w = text.length * 5.6, right = px + 12 + w < W - 4, x0 = right ? px + 12 : px - 12 - w;
    let y0 = py - 10;
    for (let t = 0; t < 6 && placed.some(b => x0 < b.x1 && x0 + w > b.x0 && Math.abs(y0 - b.y) < 13); t++) y0 += 13;
    if (y0 > H - m.b - 4) y0 = py + 16;
    placed.push({ x0, x1: x0 + w, y: y0 });
    svg += '<text x="' + (right ? x0 : x0 + w) + '" y="' + y0 + '" text-anchor="' + (right ? 'start' : 'end') + '" style="fill:var(--ink);font-size:11px;font-weight:600">' + esc(text) + '</text>';
  }
  svg += '</svg>';
  const usedModels = models.filter(m2 => pts.some(r => r.model === m2));
  const usedModes = MODE_ORDER.filter(k => pts.some(r => r.mode === k));
  const key = k => '<svg width="16" height="16" viewBox="-9 -9 18 18" style="fill:var(--muted)">' + shape(Math.max(0, MODE_ORDER.indexOf(k)), 0, 0, '', 5.5) + '</svg>';
  $(id).innerHTML = svg + '<div class="legend">' + usedModels.map(m2 => '<span><span class="dot" style="background:' + colorOf(m2) + '"></span>' + esc(shortModel(m2)) + '</span>').join('') + '</div><div class="legend">' + usedModes.map(k => '<span data-mode="' + k + '" tabindex="0" style="cursor:help">' + key(k) + esc(modeName(k)) + '</span>').join('') + '</div><div class="pin" id="pin-' + id + '">Hover a point for details, click it to pin them here. Labels mark the best trade-offs: no other setup is cheaper and at least as accurate.</div>';
  const info = r => '<b>' + esc(setupText(r)) + '</b><br>Accuracy ' + pct(r.accuracy) + ' (' + r.correct + ' of ' + r.runs + ' conversations) · ' + usdK(r.costPerCorrect) + ' per 1,000 correct answers · ' + sec(r.secPerRun) + ' per conversation';
  $(id).querySelectorAll('.pt').forEach(c => {
    const r = pts[Number(c.dataset.i)];
    c.addEventListener('mousemove', e => { e.stopPropagation(); showTip(info(r), e.clientX, e.clientY); });
    c.addEventListener('mouseleave', hideTip);
    c.addEventListener('click', () => { $('pin-' + id).innerHTML = info(r); });
  });
}

function hbars (items, fmt, max) {
  const top = max ?? Math.max(...items.map(i => i.value), 1e-12);
  return '<div class="rows">' + items.map(i => '<div class="hrow"><div class="lab">' + i.label + '</div><div class="track"><div class="fill" style="width:' + Math.max(1, i.value / top * 100) + '%;background:' + (i.color || 'var(--accent)') + '"></div></div><div class="val">' + fmt(i.value) + '</div></div>').join('') + '</div>';
}
const heatColor = v => 'color-mix(in srgb,var(--accent) ' + Math.round(8 + v * 82) + '%,var(--surface))';
const heatInk = v => v > .55 ? '#fff' : 'var(--ink)';

function reasoningEffect (list) {
  const key = r => [r.model, r.mode, r.strict].join('|');
  const by = group(list, key), out = [];
  for (const items of by.values()) {
    const off = items.find(r => r.reasoning === 'off'), low = items.find(r => r.reasoning === 'low');
    if (off && low) out.push({ off, low, dAcc: (low.accuracy - off.accuracy) * 100, dCost: off.costPerRun ? (low.costPerRun - off.costPerRun) / off.costPerRun * 100 : 0, dTime: off.secPerRun ? (low.secPerRun - off.secPerRun) / off.secPerRun * 100 : 0 });
  }
  return out;
}

function insights (list) {
  const out = [];
  const reliable = list.filter(r => r.runs >= 10);
  const byMode = [...group(reliable, r => r.mode)].map(([k, v]) => ({ k, ...aggregate(v) })).filter(o => o.runs).sort((a, b) => b.accuracy - a.accuracy);
  if (byMode.length > 1) {
    const best = byMode[0], worst = byMode[byMode.length - 1];
    out.push({ icon: '✓', cls: 'good', text: '<b>' + esc(modeName(best.k)) + '</b> is the most reliable mode: ' + pct(best.accuracy) + ' of conversations correct on average, at ' + usdK(best.costPerCorrect) + ' per 1,000 correct answers.' });
    out.push({ icon: '!', cls: worst.accuracy < .5 ? 'bad' : 'warn', text: '<b>' + esc(modeName(worst.k)) + '</b> is the weakest: ' + pct(worst.accuracy) + ' correct on average, and it accounts for ' + pct(worst.cost / (aggregate(list).cost || 1)) + ' of the total spend.' });
  }
  const eff = reasoningEffect(list);
  if (eff.length) {
    const avg = k => eff.reduce((a, e) => a + e[k], 0) / eff.length;
    out.push({ icon: '↗', cls: '', text: 'Raising reasoning from off to low changed accuracy by <b>' + signed(avg('dAcc'), ' points') + '</b>, cost per conversation by <b>' + signed(avg('dCost'), '%') + '</b> and time per conversation by <b>' + signed(avg('dTime'), '%') + '</b>, on average over ' + eff.length + ' comparable setups.' });
  }
  const timeouts = sum(list, 'errors');
  if (timeouts) out.push({ icon: '!', cls: 'warn', text: '<b>' + timeouts + '</b> API errors or timeouts happened, mostly in forced function calling modes.' });
  const withCache = aggregate(list);
  if (withCache.cacheRows && withCache.saved > 0) out.push({ icon: '$', cls: 'good', text: 'Prompt caching saved an estimated <b>' + usd(withCache.saved) + '</b> (' + pct(withCache.saved / withCache.costNoCache) + ' of what these runs would have cost without it).' });
  return out;
}

function renderSummary (list) {
  const el = $('tab-summary');
  if (!list.length) { el.innerHTML = '<div class="empty" style="margin-top:20px">No results for this selection.</div>'; return; }
  const total = aggregate(list);
  const pool = list.filter(r => r.runs >= 10);
  const strong = pool.filter(r => r.accuracy >= .9);
  const value = strong.slice().sort((a, b) => (a.costPerCorrect ?? Infinity) - (b.costPerCorrect ?? Infinity))[0];
  const accurate = pool.slice().sort((a, b) => b.accuracy - a.accuracy || (a.costPerCorrect ?? Infinity) - (b.costPerCorrect ?? Infinity))[0];
  const fast = strong.slice().sort((a, b) => (a.secPerRun ?? Infinity) - (b.secPerRun ?? Infinity))[0];
  const head = value ? '<span class="headline"><em>' + esc(value.snapshot) + '</em> is the best value: ' + pct(value.accuracy) + ' of conversations answered correctly for ' + usdK(value.costPerCorrect) + ' per 1,000 correct answers, in ' + sec(value.secPerRun) + ' per conversation.</span>' : '<span class="headline">No setup reached 90% accuracy in this selection.</span>';
  const rec = (tag, r, why) => '<div class="card rec"><div class="tag">' + tag + '</div>' + (r ? '<div class="big">' + esc(r.snapshot) + '</div>' + setupChip(r, {}) + '<div class="facts"><span><b>' + pct(r.accuracy) + '</b> accuracy</span><span><b>' + usdK(r.costPerCorrect) + '</b> per 1,000 correct</span><span><b>' + sec(r.secPerRun) + '</b> per conversation</span></div><div class="muted" style="font-size:12.5px">' + why + '</div>' : '<div class="muted">No setup qualifies.</div>') + '</div>';
  const spend = [...group(list, r => r.model)].map(([k, v]) => {
    const b = { good: 0, mixed: 0, bad: 0 };
    for (const r of v) b[r.accuracy >= .9 ? 'good' : r.accuracy >= .5 ? 'mixed' : 'bad'] += r.cost;
    return { k, total: b.good + b.mixed + b.bad, ...b };
  }).sort((a, b) => b.total - a.total);
  const maxSpend = Math.max(...spend.map(s => s.total), 1e-12);
  const wasted = spend.reduce((a, s) => a + s.bad, 0);
  const moneyBars = '<div class="rows">' + spend.map(s => '<div class="hrow"><div class="lab"><span class="dot" style="background:' + colorOf(s.k) + '"></span> ' + esc(shortModel(s.k)) + '</div><div class="track stack" style="background:none" title="' + esc(shortModel(s.k)) + '"><div class="track stack" style="width:' + (s.total / maxSpend * 100) + '%;background:none">' + ['good', 'mixed', 'bad'].map(t => s[t] ? '<div class="fill" style="width:' + (s[t] / s.total * 100) + '%;background:' + ({ good: 'var(--accent)', mixed: 'var(--muted)', bad: 'var(--bad)' })[t] + '"></div>' : '').join('') + '</div></div><div class="val">' + usd(s.total) + '</div></div>').join('') + '</div><div class="legend"><span><span class="dot" style="background:var(--accent)"></span>setups at 90% accuracy or more</span><span><span class="dot" style="background:var(--muted)"></span>between 50% and 90%</span><span><span class="dot" style="background:var(--bad)"></span>under 50% (money mostly wasted)</span></div>';
  el.innerHTML =
    '<div class="card" style="margin-top:20px">' + head + '<div class="sub">Based on ' + num(total.runs) + ' conversations across ' + total.setups + ' setups, ' + esc(DATA.results.length ? '' : '') + 'for ' + usd(total.cost) + ' in total. A setup is a model plus how it is called; see the help icon for definitions.</div></div>' +
    '<div class="grid g3">' + rec('Best value', value, 'Cheapest correct answers among setups at 90% accuracy or more.') + rec('Most accurate', accurate, 'Highest share of correct conversations; ties go to the cheaper setup.') + rec('Fastest reliable', fast, 'Shortest conversation among setups at 90% accuracy or more.') + '</div>' +
    '<div class="grid g4">' + [['Total spend', usd(total.cost), 'all conversations shown'], ['Conversations tested', num(total.runs), total.setups + ' setups'], ['Overall accuracy', pct(total.accuracy), 'across every setup, good or bad'], ['Spend on weak setups', pct(total.cost ? wasted / total.cost : 0), usd(wasted) + ' went to setups under 50% accuracy']].map(k => '<div class="card kpi"><div class="k">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="n">' + k[2] + '</div></div>').join('') + '</div>' +
    '<div class="grid g2"><div class="card"><h2>Accuracy against cost</h2><p class="lead">Top left is best: more accurate and cheaper. Cost is per correct conversation, so failures are charged to the winners.</p><div id="sc1"></div></div><div class="card"><h2>Where the money went</h2><p class="lead">Spend per model, split by how reliable the setup was.</p>' + moneyBars + '</div></div>' +
    '<div class="card"><h2>What to know</h2><ul class="insights" style="margin-top:12px">' + insights(list).map(i => '<li><span class="ic ' + i.cls + '">' + i.icon + '</span><span>' + i.text + '</span></li>').join('') + '</ul></div>';
  scatter('sc1', list, 'costPerCorrect', 'Cost per correct conversation (log scale)', v => '$' + (v < 0.001 ? v.toFixed(5) : v.toFixed(4)), true);
}

function renderModels (list) {
  const el = $('tab-models');
  const byModel = [...group(list, r => r.model)].map(([k, v]) => ({ k, rows: v, ...aggregate(v) }));
  const setupWord = r => modeName(r.mode) + ', ' + reasoningName(r.reasoning);
  const cards = byModel.map(o => {
    const ok = o.rows.filter(r => r.runs >= 10);
    const strong = ok.filter(r => r.accuracy >= .9).sort((a, b) => (a.costPerCorrect ?? Infinity) - (b.costPerCorrect ?? Infinity));
    const best = strong[0] || ok.slice().sort((a, b) => b.accuracy - a.accuracy || (a.costPerCorrect ?? Infinity) - (b.costPerCorrect ?? Infinity))[0];
    let why = '';
    if (best && strong.length) {
      why = 'Chosen because it is the cheapest of the ' + strong.length + ' setup' + (strong.length > 1 ? 's' : '') + ' of this model that reach 90% accuracy: ' + pct(best.accuracy) + ' accuracy at ' + usdK(best.costPerCorrect) + ' per 1,000 correct answers.' + (strong[1] ? ' The next cheapest is ' + setupWord(strong[1]) + ' at ' + usdK(strong[1].costPerCorrect) + ' (' + pct(strong[1].accuracy) + ' accuracy).' : ' No other setup of this model reaches 90%.');
    } else if (best) {
      why = 'No setup of this model reaches 90% accuracy, so this is the most accurate one: ' + pct(best.accuracy) + ' at ' + usdK(best.costPerCorrect) + ' per 1,000 correct answers.';
    }
    const p = o.rows[0].pricing || {};
    const strip = MODE_ORDER.filter(m => o.rows.some(r => r.mode === m)).map(m => {
      const items = o.rows.filter(r => r.mode === m).sort((a, b) => b.accuracy - a.accuracy);
      const top = items[0];
      const detail = items.map(r => reasoningName(r.reasoning) + (r.strict === 'on' ? ', strict schema' : '') + ': ' + pct(r.accuracy)).join(' | ');
      return '<div class="hrow" style="grid-template-columns:210px 1fr 44px"><div class="lab">' + modeChip(m) + '</div><div class="track" data-tip="' + esc('Accuracy of each setup in this mode. ' + detail) + '"><div class="fill" style="width:' + Math.max(1, top.accuracy * 100) + '%"></div></div><div class="val">' + pct(top.accuracy) + '</div></div>';
    }).join('');
    return { best, html: '<div class="card mcard"><h3><span class="dot" style="background:' + colorOf(o.k) + '"></span> ' + esc(shortModel(o.k)) + ' <span class="muted" style="font-weight:400">' + esc(o.k.split('/')[0]) + '</span></h3>' +
      '<dl><dt>Price</dt><dd>' + (p.input != null ? '$' + p.input + ' in, $' + p.output + ' out per million tokens' : '-') + '</dd><dt>Best setup</dt><dd>' + (best ? setupChip(best, { modeTip: why }) : '-') + '</dd></dl>' +
      '<div class="stats"><div><div class="n">' + (best ? pct(best.accuracy) : '-') + '</div><div class="l">accuracy of best setup</div></div><div><div class="n">' + (best ? usdK(best.costPerCorrect) : '-') + '</div><div class="l">per 1,000 correct</div></div><div><div class="n">' + (best ? sec(best.secPerRun) : '-') + '</div><div class="l">per conversation</div></div></div>' +
      '<div><div class="sub" style="margin-bottom:6px">Accuracy by mode, best reasoning setting of each (hover a bar to see every setting)</div><div class="rows">' + strip + '</div></div></div>' };
  }).sort((a, b) => (b.best ? b.best.accuracy : 0) - (a.best ? a.best.accuracy : 0) || (a.best?.costPerCorrect ?? Infinity) - (b.best?.costPerCorrect ?? Infinity));
  el.innerHTML = '<div style="margin-top:20px"><h2>Models</h2><p class="lead">One card per model, ordered by the accuracy of its best setup. The best setup is the cheapest one that reaches 90% accuracy, or the most accurate one when none does. Hover its mode to see why it was chosen.</p></div><div class="grid g3">' + cards.map(c => c.html).join('') + '</div>';
}

function renderModes (list) {
  const el = $('tab-modes');
  const modes = MODE_ORDER.filter(m => list.some(r => r.mode === m));
  const cards = modes.map(m => { const a = aggregate(list.filter(r => r.mode === m)); const info = MODES[m]; return '<div class="card mcard"><h3>' + esc(info.name) + '</h3><dl><dt>Input</dt><dd><ul style="margin:0;padding-left:16px">' + info.input.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></dd><dt>Output</dt><dd><ul style="margin:0;padding-left:16px">' + info.output.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></dd></dl><div class="muted" style="font-size:12.5px">' + esc(info.note) + '</div><div class="stats"><div><div class="n">' + pct(a.accuracy) + '</div><div class="l">accuracy</div></div><div><div class="n">' + usdK(a.costPerCorrect) + '</div><div class="l">per 1,000 correct</div></div><div><div class="n">' + sec(a.secPerRun) + '</div><div class="l">per conversation</div></div></div></div>'; }).join('');
  const ms = [...new Set(list.map(r => r.model))].sort();
  const heat = (fn, fmt, scale) => '<div class="scroll"><table class="hm"><thead><tr><th class="l">Model</th>' + modes.map(m => '<th>' + modeChip(m) + '</th>').join('') + '</tr></thead><tbody>' + ms.map(m => '<tr><td class="l"><span class="dot" style="background:' + colorOf(m) + '"></span> ' + esc(shortModel(m)) + '</td>' + modes.map(k => { const items = list.filter(r => r.model === m && r.mode === k); if (!items.length) return '<td class="c muted">-</td>'; const a = aggregate(items); const v = fn(a); const s = scale(v, a); return '<td class="c" style="background:' + heatColor(s) + ';color:' + heatInk(s) + '" data-tip="' + esc(shortModel(m) + ' · ' + modeName(k) + ': ' + pct(a.accuracy) + ' accuracy, ' + usdK(a.costPerCorrect) + ' per 1,000 correct, ' + sec(a.secPerRun) + ' per conversation, averaged over ' + items.length + ' setups') + '">' + fmt(v) + '</td>'; }).join('') + '</tr>').join('') + '</tbody></table></div>';
  const accHeat = heat(a => a.accuracy, pct, v => v);
  const maxCost = Math.max(...list.map(r => r.costPerCorrect || 0), 1e-9);
  const costHeat = heat(a => a.costPerCorrect, v => v == null ? 'none correct' : usdK(v), (v) => v == null ? 0 : 1 - Math.min(1, Math.log10(1 + v / 0.0003) / Math.log10(1 + maxCost / 0.0003)));
  const eff = reasoningEffect(list);
  const effTable = eff.length ? '<div class="scroll"><table><thead><tr><th class="l">Setup</th><th>Accuracy (reasoning off)</th><th>Accuracy (reasoning low)</th><th>Change in accuracy</th><th>Change in cost per conversation</th><th>Change in time per conversation</th></tr></thead><tbody>' + eff.sort((a, b) => b.dAcc - a.dAcc).map(e => '<tr><td class="l">' + setupChip(e.off, {}).replace(/<span class="pill" tabindex="0" data-tip="[^"]*">reasoning off<\/span>/, '') + '</td><td>' + pct(e.off.accuracy) + '</td><td>' + pct(e.low.accuracy) + '</td><td class="' + (e.dAcc > 0 ? '' : '') + '"><b style="color:' + (e.dAcc > 0 ? 'var(--good)' : e.dAcc < 0 ? 'var(--bad)' : 'var(--muted)') + '">' + signed(e.dAcc, ' points') + '</b></td><td>' + signed(e.dCost, '%') + '</td><td>' + signed(e.dTime, '%') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">No setup was run with both reasoning off and low.</div>';
  el.innerHTML = '<div style="margin-top:20px"><h2>Modes</h2><p class="lead">A mode is the way the request and the answer are shaped. Hover any mode name anywhere in this report for its details.</p></div><div class="grid g2">' + cards + '</div>' +
    '<div class="card"><h2>Accuracy by model and mode</h2><p class="lead">Darker is more accurate. Each cell averages every reasoning level and strict setting tested for that pair.</p>' + accHeat + '</div>' +
    '<div class="card"><h2>Cost per 1,000 correct answers</h2><p class="lead">Darker is cheaper. "None correct" means the pair never produced a correct conversation.</p>' + costHeat + '</div>' +
    '<div class="card"><h2>Does reasoning pay off?</h2><p class="lead">The same model, mode and strict setting with reasoning off versus low.</p>' + effTable + '</div>';
}

function renderCost (list) {
  const el = $('tab-cost');
  const paid = list.filter(r => r.correct > 0 && r.runs >= 5).sort((a, b) => a.costPerCorrect - b.costPerCorrect).slice(0, 14);
  const fast = list.filter(r => r.correct > 0 && r.runs >= 5 && r.accuracy >= .5).sort((a, b) => a.secPerRun - b.secPerRun).slice(0, 14);
  const lab = r => '<span class="dot" style="background:' + colorOf(r.model) + '"></span> <b>' + esc(r.snapshot) + '</b><br><span class="muted" style="font-size:12px">' + esc(modeName(r.mode)) + ' · ' + esc(reasoningName(r.reasoning)) + '</span>';
  const total = aggregate(list);
  const byModel = [...group(list, r => r.model)].map(([k, v]) => ({ k, ...aggregate(v) })).sort((a, b) => b.cost - a.cost);
  const pricing = [...group(list, r => r.model)].map(([k, v]) => { const p = v[0].pricing || {}; return '<tr><td class="l"><span class="dot" style="background:' + colorOf(k) + '"></span> ' + esc(shortModel(k)) + '</td><td>$' + num(p.input, 3) + '</td><td>$' + num(p.output, 3) + '</td><td>' + (p.cacheRead != null ? '$' + num(p.cacheRead, 3) : '-') + '</td><td>' + (p.cacheWrite != null ? '$' + num(p.cacheWrite, 3) : '-') + '</td></tr>'; }).join('');
  el.innerHTML = '<div style="margin-top:20px"><h2>Cost and speed</h2><p class="lead">Both views only include setups with at least 5 conversations and at least one correct answer. Costs are estimates from the pi-ai price catalog.</p></div>' +
    '<div class="grid g2"><div class="card"><h2>Cheapest correct answers</h2><p class="lead">Cost per correct conversation, lowest first.</p>' + hbars(paid.map(r => ({ label: lab(r), value: r.costPerCorrect, color: colorOf(r.model) })), usd) + '</div>' +
    '<div class="card"><h2>Fastest conversations</h2><p class="lead">Seconds per conversation, for setups with at least 50% accuracy.</p>' + hbars(fast.map(r => ({ label: lab(r), value: r.secPerRun, color: colorOf(r.model) })), sec) + '</div></div>' +
    '<div class="grid g2"><div class="card"><h2>Accuracy against speed</h2><p class="lead">Top left is best: more accurate and faster.</p><div id="sc2"></div></div>' +
    '<div class="card"><h2>Spend by model</h2><p class="lead">Total ' + usd(total.cost) + '. A high bar is not always a high price: it also reflects how many setups were tested.</p>' + hbars(byModel.map(o => ({ label: '<span class="dot" style="background:' + colorOf(o.k) + '"></span> ' + esc(shortModel(o.k)), value: o.cost, color: colorOf(o.k) })), usd) + '<h3 style="margin-top:20px">List prices, USD per million tokens</h3><div class="scroll"><table><thead><tr><th class="l">Model</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th></tr></thead><tbody>' + pricing + '</tbody></table></div></div></div>';
  scatter('sc2', list, 'secPerRun', 'Seconds per conversation', v => (v / 1000).toFixed(1) + ' s', false);
}

function renderCache (list) {
  const el = $('tab-cache');
  const cached = list.filter(r => r.hasCache);
  const head = '<div style="margin-top:20px"><h2>Prompt cache</h2><p class="lead">Providers charge much less for the part of a prompt they have already seen. Every call here repeats the same instructions, so a mode that keeps the beginning of the prompt stable and lets the provider cache it saves money. Savings are estimated from the catalog prices: cached tokens read at the cache price instead of the full input price, minus any premium paid to write the cache.</p></div>';
  if (!cached.length) { el.innerHTML = head + '<div class="empty">This selection has no cache data. Runs made before cache tracking was added did not record cached tokens. Run the evals again and this tab fills in.</div>'; return; }
  const total = aggregate(cached);
  const tiles = '<div class="grid g4">' + [['Cache hit rate', pct(total.hitRate), 'share of input tokens served from cache'], ['Estimated savings', usd(total.saved), 'versus paying full input price'], ['Cost without cache', usd(total.costNoCache), 'estimate for the same runs'], ['Cost with cache', usd(total.cachedCost), total.costNoCache ? pct(total.saved / total.costNoCache) + ' cheaper' : '']].map(k => '<div class="card kpi"><div class="k">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="n">' + k[2] + '</div></div>').join('') + '</div>';
  const byMode = MODE_ORDER.map(m => ({ m, ...aggregate(cached.filter(r => r.mode === m)) })).filter(o => o.setups);
  const byModel = [...group(cached, r => r.model)].map(([k, v]) => ({ k, ...aggregate(v) })).sort((a, b) => (b.hitRate || 0) - (a.hitRate || 0));
  const best = byMode.slice().sort((a, b) => (b.saved / (b.costNoCache || 1)) - (a.saved / (a.costNoCache || 1)))[0];
  const verdict = best && best.saved > 0 ? '<div class="note"><b>' + esc(modeName(best.m)) + '</b> benefits most from caching: ' + pct(best.hitRate) + ' of its input came from cache, a saving of ' + pct(best.saved / best.costNoCache) + ' on its cost.</div>' : '<div class="note">No mode saved money through caching in this selection. Small prompts fall under the minimum size most providers need before they cache anything (around 1,000 tokens), so the skill evals, which use the real 16 KB prompt, are the better place to measure it.</div>';
  const table = '<div class="scroll"><table><thead><tr><th class="l">Setup</th><th>Input tokens</th><th>Read from cache</th><th>Hit rate</th><th>Cost with cache</th><th>Cost without cache</th><th>Saved</th></tr></thead><tbody>' + cached.slice().sort((a, b) => (b.saved || 0) - (a.saved || 0)).map(r => '<tr><td class="l" data-mode="' + esc(r.mode) + '">' + compact(r) + '</td><td>' + num(r.inputAll) + '</td><td>' + num(r.cacheRead) + '</td><td>' + pct(r.hitRate) + '</td><td>' + usd(r.cost) + '</td><td>' + usd(r.costNoCache) + '</td><td>' + usd(r.saved) + '</td></tr>').join('') + '</tbody></table></div>';
  el.innerHTML = head + tiles +
    '<div class="grid g2"><div class="card"><h2>Hit rate by mode</h2><p class="lead">Share of input tokens read from cache.</p>' + hbars(byMode.map(o => ({ label: modeChip(o.m), value: o.hitRate || 0 })), pct, 1) + '</div><div class="card"><h2>Estimated savings by mode</h2><p class="lead">Share of the cost avoided thanks to caching.</p>' + hbars(byMode.map(o => ({ label: modeChip(o.m), value: Math.max(0, o.saved / (o.costNoCache || 1)), color: 'var(--good)' })), pct, 1) + '</div></div>' +
    '<div class="card"><h2>Hit rate by model</h2><p class="lead">Providers cache differently: some need explicit markers, some cache automatically above a minimum prompt size.</p>' + hbars(byModel.map(o => ({ label: '<span class="dot" style="background:' + colorOf(o.k) + '"></span> ' + esc(shortModel(o.k)), value: o.hitRate || 0, color: colorOf(o.k) })), pct, 1) + verdict + '</div>' +
    '<div class="card"><h2>Detail per setup</h2>' + table + '</div>';
}

function renderCases (list) {
  const el = $('tab-cases');
  const cases = [...new Set(list.flatMap(r => Object.keys(r.byCase || {})))];
  const stats = cases.map(c => { let ok = 0, tot = 0; for (const r of list) { const b = r.byCase && r.byCase[c]; if (!b) continue; const [a, t] = b.correct.split('/').map(Number); ok += a; tot += t; } return { c, acc: tot ? ok / tot : 0, tot }; }).sort((a, b) => a.acc - b.acc);
  const sorted = list.slice().sort((a, b) => b.accuracy - a.accuracy || a.snapshot.localeCompare(b.snapshot));
  const grid = '<div class="scroll"><table class="hm"><thead><tr><th class="l">Setup</th>' + cases.map(c => '<th title="' + esc(c) + '">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + sorted.map(r => '<tr><td class="l" data-mode="' + esc(r.mode) + '">' + compact(r) + '</td>' + cases.map(c => { const b = r.byCase && r.byCase[c]; if (!b) return '<td class="c muted">-</td>'; const [a, t] = b.correct.split('/').map(Number); const v = t ? a / t : 0; return '<td class="c" style="background:' + heatColor(v) + ';color:' + heatInk(v) + '" data-tip="' + esc(c + ': ' + b.correct + ' correct, ' + (b.avgMsPerCall ?? '-') + ' ms average call, ' + usd(b.cost) + ' total, ' + b.turnsPerRun + ' calls per conversation') + '">' + a + '/' + t + '</td>'; }).join('') + '</tr>').join('') + '</tbody></table></div>';
  const fails = new Map();
  for (const r of list) for (const i of r.issues) { const k = i.issue.slice(0, 120); fails.set(k, (fails.get(k) || 0) + i.count); }
  const top = [...fails].sort((a, b) => b[1] - a[1]).slice(0, 10);
  el.innerHTML = '<div style="margin-top:20px"><h2>Cases</h2><p class="lead">Which tasks are hard for the models, independent of how they were called.</p></div>' +
    '<div class="grid g2"><div class="card"><h2>Hardest cases</h2><p class="lead">Share of correct conversations across every setup shown.</p>' + hbars(stats.map(s => ({ label: esc(s.c), value: s.acc })), pct, 1) + '</div><div class="card"><h2>Most common failures</h2><p class="lead">Failure messages recorded by the checkers and the parser, with how many times each happened.</p>' + (top.length ? '<div class="rows">' + top.map(t => '<div style="display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:13px"><b style="text-align:right">' + t[1] + '×</b><span class="muted">' + esc(t[0]) + '</span></div>').join('') + '</div>' : '<div class="empty">No failures recorded.</div>') + '</div></div>' +
    '<div class="card"><h2>Every setup against every case</h2><p class="lead">Correct conversations over total. Darker is better.</p>' + grid + '</div>';
}

}

const NUM = /^([+-]?)\$?(\d[\d,]*\.?\d*)\s*(%|s|ms|points|×|of\s+\d+.*)?$/;
function cellValue (td) {
  const t = td.textContent.trim().replace(/−/g, '-');
  const ratio = t.match(/^(\d+)\/(\d+)$/);
  if (ratio) return Number(ratio[1]) / (Number(ratio[2]) || 1);
  const m = t.match(NUM);
  if (m) return (m[1] === '-' ? -1 : 1) * Number(m[2].replace(/,/g, ''));
  return t;
}
function enableSort (root) {
  root.querySelectorAll('table').forEach(table => {
    if (table.querySelector('th.sortable') || table.closest('#tab-history')) return;
    const head = table.querySelectorAll('thead th');
    head.forEach((th, index) => {
      th.classList.add('sortable');
      th.title = 'Click to sort';
      th.addEventListener('click', () => {
        const body = table.tBodies[0]; if (!body) return;
        const rows = [...body.rows];
        const values = rows.map(r => cellValue(r.cells[index]));
        const numeric = values.some(v => typeof v === 'number');
        const asc = table._col === index ? !table._asc : !numeric;
        table._col = index; table._asc = asc;
        const order = rows.map((r, i) => ({ r, v: values[i] })).sort((a, b) => {
          const an = typeof a.v === 'number', bn = typeof b.v === 'number';
          if (an && bn) return asc ? a.v - b.v : b.v - a.v;
          if (an) return -1;
          if (bn) return 1;
          return asc ? String(a.v).localeCompare(String(b.v)) : String(b.v).localeCompare(String(a.v));
        });
        order.forEach(o => body.appendChild(o.r));
        head.forEach(h => h.classList.remove('sorted', 'asc'));
        th.classList.add('sorted'); if (asc) th.classList.add('asc');
      });
    });
  });
}

function draw () {
  scope(); meta();
  const list = visible();
  $('tabs').innerHTML = TABS.map(t => '<button role="tab" data-t="' + t[0] + '" class="' + (state.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { state.tab = b.dataset.t; location.hash = state.tab; draw(); window.scrollTo({ top: 0 }); });
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + state.tab));
  const t = TABS.find(x => x[0] === state.tab);
  t[2](list);
  enableSort($('tab-' + state.tab));
}
const initial = location.hash.slice(1); if (TABS.some(t => t[0] === initial)) state.tab = initial;
buildHelp(); draw();
</script>
</body>
</html>
